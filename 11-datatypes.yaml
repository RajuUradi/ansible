- name: datatypes in ansible
  hosts: local
  connection: local
  vars:
   Program: "Devsecops with aws"
   duration: 140
   is_live: true
   DETAILS:
    months: 4
    programtype: "online"
   TOPICS:
    -linux
    -shell
    -ansible
  tasks:
   - name: print variables
     ansible.builtin.debug:
      msg: |
       program: {{Program}}
       duration: {{duration}}
       is_live: {{is_live}}
       details: {{DETAILS}}
       topics: {{TOPICS}}   

