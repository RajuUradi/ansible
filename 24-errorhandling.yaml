- name: error_handling in ansible
  hosts: all
  connection: local
  become: yes

  tasks:
   - name: check user exist or not 
     ansible.builtin.command: id Roboshop 
     register: user_output
     ignore_errors: true

   - name: print output of above tasks
     ansible.builtin.debug:
      msg: "{{user_output}}"  

   - name: create user if not existed
     ansible.builtin.command: useradd roboshop
     when: user_output.rc != 0